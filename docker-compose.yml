version: '3.8'

services:
  api:
    build:
      context: .
      target: development
    container_name: nota-corretagem-api-dev
    volumes:
      # Monta o diretório atual para habilitar hot-reload no uvicorn
      - .:/app
    ports:
      - "${PORT:-8000}:8000"
    env_file:
      - .env
    environment:
      - ENVIRONMENT=development
      - LOG_LEVEL=debug
    restart: unless-stopped
